# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Struts2 S2-016 (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's struts2/s2-016, vendored in app/ and built from Vulhub's Dockerfile as is.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-struts2-s2-016

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.243.0/24, internet: false}

machines:
  struts2:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 8080
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: app

checks:
  - name: the application answers
    http: http://struts2:8080/index.action
    wait: 120
  - name: index.action renders the application page
    script: checks/action.sh
    wait: 60

message: |
  A Struts2 application answers at {{ machines.struts2.ports.web.url }}index.action.
  Struts2 knows special parameter prefixes for navigation.
